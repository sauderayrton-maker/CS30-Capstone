<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Flux</title>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="icon" type="image/png" href="logoround.png" />
    </head>
    <body>
        <div class="workspace">
            <div class="top-row">
                <div class="window piano-space">
                    <div class="window-title">
                        <img
                            src="logoround.png"
                            width="16"
                            height="16"
                            alt="Flux"
                            class="title-logo"
                        />
                        <span class="title-brand">Flux</span>
                        <a href="flashbang.html" class="title-link">Light</a>

                        <span class="title-divider"></span>
                        <span>Piano Roll</span>
                        <span class="pulse-dot"></span>
                    </div>
                    <iframe src="pianoroll.html"></iframe>
                    <div class="window-bar">
                        <span class="hint"><kbd>Space</kbd> play/pause</span>
                        <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> bpm</span>
                        <span class="hint"><kbd>W</kbd> waveform</span>
                        <span class="hint"><kbd>S</kbd> save</span>
                        <span class="hint"><kbd>L</kbd> load</span>
                        <span class="hint"><kbd>E</kbd> record</span>
                        <span class="hint"><kbd>C</kbd> clear</span>
                    </div>
                </div>
                <div class="window mixer-space">
                    <div class="window-title">Mixer</div>
                    <iframe src="mixer.html"></iframe>
                </div>
            </div>
            <div class="window drum-space">
                <div class="window-title">Drum Pad</div>
                <iframe src="drumpad.html"></iframe>
                <div class="window-bar">
                    <span class="hint"><kbd>1</kbd> kick</span>
                    <span class="hint"><kbd>2</kbd> snare</span>
                    <span class="hint"><kbd>3</kbd> clap</span>
                    <span class="hint"><kbd>4</kbd> tom</span>
                    <span class="hint"><kbd>5</kbd> hi-hat</span>
                    <span class="hint"><kbd>6</kbd> open hat</span>
                    <span class="hint"><kbd>7</kbd> cowbell</span>
                    <span class="hint"><kbd>8</kbd> crash</span>
                    <span class="hint"><kbd>Space</kbd> play/pause</span>
                    <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> bpm</span>
                    <span class="hint"><kbd>S</kbd> save</span>
                    <span class="hint"><kbd>L</kbd> load</span>
                    <span class="hint"><kbd>E</kbd> export</span>
                    <span class="hint"><kbd>C</kbd> clear</span>
                </div>
            </div>
        </div>
    </body>
</html>
