<!doctype html>
<html lang="en">
    <head>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>

        <link rel="stylesheet" type="text/css" href="style.css" />
        <meta charset="utf-8" />
    </head>
    <body>
        <main></main>
        <button
            id="preset-btn"
            onclick="loadPreset('girlsWantGirls')"
            style="
                position: fixed;
                top: 6px;
                right: 12px;
                z-index: 100;
                background: #131009;
                color: #e6c200;
                border: 1px solid #3a3530;
                border-radius: 4px;
                font-family: &quot;Open Sans&quot;, sans-serif;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 0 10px;
                height: 22px;
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    background 0.15s;
            "
            onmouseover="
                this.style.borderColor = '#e6c200';
                this.style.background = '#1a1714';
            "
            onmouseout="
                this.style.borderColor = '#3a3530';
                this.style.background = '#131009';
            "
        >
            preset
        </button>
        <script src="applets/piano-roll.js"></script>
    </body>
</html>
